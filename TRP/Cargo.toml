[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# The packages' own version stays at 0.0.0: it is part of what cargo builds a crate under, so
# raising it rebuilt all four crates and relinked every test binary at every change. TRP's
# number is below, under [workspace.metadata.trp].
version = "0.0.0"
edition = "2021"
publish = false

[workspace.metadata.trp]
# One number for the whole of TRP, raised with every change (docs\manual.md, "Versions"; in the
# private repository, .claude\skills\land\check.sh reads and bumps it). trp-app's build.rs reads
# it from here and the app prints it first (`TRP_VERSION`).
version = "0.143.1"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
lzma-rs = "0.3"
miniz_oxide = "0.8"
png = "0.18"
# Fonts' own tables, for how wide a screen's words are (already among Bevy's).
ttf-parser = "0.25"
# The CRC32 FMOD names a Vorbis setup header by (already among the build's, through png).
crc32fast = "1.5"
# Vorbis's packets decoded (pure Rust; the clips kept so are FMOD's, rebuilt from the install).
lewton = { version = "0.10", default-features = false }
# Unity's crunched pictures (`DXT1Crunched`, `DXT5Crunched`) decoded (pure Rust; a port of the published crunch decoder).
texture2ddecoder = "0.1.2"

# Parsing multi-megabyte bundles in an unoptimised build is too slow to iterate on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# No debug information for the crates we depend on (Bevy, PhysX and the rest): it was most of the
# build folder and of every program's .pdb, and slowed linking. Our own crates keep theirs, so a
# panic in them still names its file and line.
debug = false
# Nor their checks of themselves that only a debug build makes: the engine's builds for others
# leave them out (wgpu 26.0.1's check of its indirect draws on DirectX 12, which measures what
# it wrote by what it read, stopped the app).
debug-assertions = false

[profile.dev.package.trp-data]
opt-level = 3
