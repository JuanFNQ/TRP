[package]
name = "trp-physics"
description = "The game's physics engine, PhysX 4.1, set up as the game's engine sets it up: a corpse's ragdoll, things let fall and thrown"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# PhysX 4.1, the engine of the game's Unity (2022.3), built from its source with the C++
# compiler; 0.8.2 is the last release of the bindings on PhysX 4 (0.10 moved to 5).
physx-sys = "=0.8.2"
trp-data = { path = "../trp-data" }
serde_json.workspace = true
